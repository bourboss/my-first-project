<!DOCTYPE html>
<html>
    <head>
        <title>Create Account</title>
        <style>
            .button {
            border: none;
            color: white;
            padding: 16px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            transition-duration: 0.4s;
            cursor: pointer;
            }
            .button1 {
            background-color: white;
            color: black;
            border: 2px solid #04AA6D;
            }
            .button1:hover {
            background-color: #04AA6D;
            color: white;
            }
        </style>
    </head>
    <body>
        <form method="POST" action="/register">
            <label for="reg_username">Username: </label>
            <input type="text" id="reg_username" name="username" required><br>
            <label for ="reg_password">Password: </label>
            <input type="password" id="reg_password" name="password" required><br>
            <button class="button button1" type="submit">Register:</button>
        </form>
                <form method="POST" action="/login">
            <label>Username: </label>
            <input type="text" id="log_username" name="username" required><br>
            <label>Password: </label>
            <input type="password" id="log_password" name="password" required><br>
            <button class="button button1" type="submit">Log In:</button>
        </form>
    </body>
</html>
